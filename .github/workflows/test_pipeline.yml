name: test-pipeline

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key-with-enough-length-123456
      DATABASE_URL: sqlite+aiosqlite:///./test_doumitt.db
      CACHE_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      ENVIRONMENT: test
      DEBUG: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

      - name: Verify async migrations on SQLite
        run: alembic upgrade head
