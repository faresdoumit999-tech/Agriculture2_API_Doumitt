services:
  # 🗄️ الحاوية الأولى: قاعدة البيانات (معزولة في الشبكة الداخلية)
  db:
    image: postgres:15-alpine
    container_name: agriculture_local_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret123
      - POSTGRES_DB=agriculture_dev
    # ❌ قمنا بإزالة ports لكي لا تنكشف للإنترنت
    # ✅ نستخدم expose لفتح المنفذ لحاويات الشبكة الداخلية فقط
    expose:
      - "5432"
    networks:
      - doumitt_internal
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 🚀 الحاوية الثانية: سيرفر الباك إند (الواجهة المكشوفة الوحيدة)
  web:
    build: .
    container_name: agriculture_fastapi
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000" # ✅ السيرفر الوحيد المتصل بالعالم الخارجي
    depends_on:
      - db
      - redis # أضفنا الاعتماد على Redis
    networks:
      - doumitt_internal
    volumes:
      - .:/app
    env_file:
      - .env

  # 🧠 الحاوية الثالثة: الذاكرة المؤقتة (معزولة في الشبكة الداخلية)
  redis:
    image: redis:alpine
    container_name: doumitt_redis
    # ❌ قمنا بإزالة ports
    # ✅ نستخدم expose
    expose:
      - "6379"
    restart: always
    networks:
      - doumitt_internal

  # 👷 الحاوية الرابعة: العامل الخلفي (Celery Worker)
  celery_worker:
    build: .
    container_name: doumitt_celery_worker
    command: celery -A worker.celery_app worker --loglevel=info
    depends_on:
      - redis
      - db
    networks:
      - doumitt_internal
    volumes:
      - .:/app
    env_file:
      - .env

# 🛡️ تعريف الشبكة الداخلية المعزولة
networks:
  doumitt_internal:
    driver: bridge

# تعريف المساحة التخزينية لقاعدة البيانات
volumes:
  postgres_data: